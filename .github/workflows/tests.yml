name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install shellcheck
        run: python -m pip install shellcheck-py==0.11.0.1
      - name: Lint
        run: tests/lint.sh

  bats:
    name: bats (maper, launchlist-gen)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # maper needs bc; MIRTK and NiftySeg are replaced by the stubs in tests/stubs
      - name: Install bc and bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc
          npm install --prefix "$RUNNER_TEMP/bats" bats@1.13.0
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run the shell tests
        run: bats --print-output-on-failure tests/

  pytest:
    name: pytest (canonicalize-nifti, reorient2std-nifti)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run the Python tests
        run: python -m pytest tests/ -q

  nix:
    name: nix (package checks, container)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Builds the package, checks what it installs, and runs a pipeline with the
      # installed maper (MIRTK and NiftySeg stubbed) under the PATH the package gives it
      - name: Flake checks
        run: nix flake check --print-build-logs --no-update-lock-file
      # Without flakes: default.nix, with the nixpkgs revision that flake.lock pins
      - name: Build with nix-build
        run: nix-build default.nix --no-out-link
      # The image that build-sif turns into an Apptainer image
      - name: Build the container image
        run: nix build .#container --print-build-logs --no-link --no-update-lock-file
